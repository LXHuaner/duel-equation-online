function maybeBegin(){if(host&&ready&&otherReady&&conn?.open&&stage==='lobby'){localGear=[];otherGear=[];localWins=otherWins=0;netRound=1;send({t:'begin',hostRole:chosen,guestRole:otherRole});beginFight()}}
function connect(isHost,code){if(typeof Peer==='undefined'){say('联机组件加载失败，请检查网络');return}cleanup();host=isHost;code=(code||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(!host&&code.length!==6){say('请输入六位房间码');return}if(host)code=Math.random().toString(36).slice(2,8).padEnd(6,'0');roomCode=code;content.innerHTML='<p>正在连接……</p>';say('连接公共信令服务中');peer=new Peer(host?'duel-eq-'+code:undefined,{debug:0});peer.on('open',()=>{if(host){location.hash='room='+code;lobby();say('房间已创建，等待朋友')}else{attach(peer.connect('duel-eq-'+code,{reliable:true}));say('正在连接房主')}});peer.on('connection',c=>{if(!host||conn?.open){c.close();return}attach(c)});peer.on('disconnected',()=>say('信令连接中断；若对战仍正常可继续'));peer.on('error',e=>{say(e.type==='peer-unavailable'?'找不到房间':e.type==='unavailable-id'?'房间码已占用，请重新创建':'网络连接错误：'+e.message)});}
function attach(c){conn=c;c.on('open',()=>{say('连接成功');send({t:'role',role:chosen});send({t:'ready',v:ready});lobby()});c.on('data',receive);c.on('close',()=>{otherReady=false;if(net.active){net.active=false;stage='disconnected';panel.style.display='flex';content.innerHTML='<h3>对方断线</h3><p>请返回菜单重新创建房间。</p>'}else lobby();say('连接已断开')});c.on('error',e=>say('连接错误：'+e.message))}
function receive(d){if(!d||typeof d!=='object')return;if(d.t==='role'&&validRole(d.role)){otherRole=d.role;if(stage==='lobby')lobby()}else if(d.t==='ready'){otherReady=!!d.v;if(stage==='lobby')lobby();maybeBegin()}
else if(d.t==='begin'&&!host){chosen=d.guestRole;otherRole=d.hostRole;localGear=[];otherGear=[];localWins=otherWins=0;netRound=1;beginFight()}
else if(d.t==='input'&&host&&net.active){remoteInput={...remoteInput,...d.v};net.remoteInput=remoteInput;}
else if(d.t==='snapshot'&&!host&&net.active){applySnapshot(d.v)}
else if(d.t==='result'&&!host){netRound=d.round;localWins=d.guestWins;otherWins=d.hostWins;showResult(d.winner)}
else if(d.t==='choices'&&!host){options=d.items;showChoices(d.kind)}
else if(d.t==='pick'&&host&&stage==='pick'){remotePick=d.id;checkPicks()}
else if(d.t==='next'&&!host){localGear=d.guestGear;otherGear=d.hostGear;netRound=d.round;beginFight()}}
function beginFight(){net.active=true;net.host=host;remoteInput={x:0,y:0,attack:false};net.remoteInput=remoteInput;stage='fight';panel.style.display='none';gameMode='solo';round=netRound;wins=host?localWins:otherWins;losses=host?otherWins:localWins;roleId=chosen;gear=localGear;evolution=0;net.startRound()}
function actorFor(r,g,x,ai){const oldRole=roleId,oldGear=gear;roleId=r;gear=g;let a=makeActor(x,250,ai);a.ai=false;a.roleId=r;a.loadout=g;a.evo=0;if(g.includes('bloodgambler')){a.max=Math.max(1,Math.round(a.max*.7));a.hp=a.max}roleId=oldRole;gear=oldGear;return a}
function startNetRound(){fissures=[];delayedStrikes=[];chainLinks=[];dragonLanes=[];royalFields=[];curses=[];selectArena();player=actorFor(chosen,localGear,host?125:775,false);enemy=actorFor(otherRole,otherGear,host?775:125,false);enemy.face=Math.PI;particles=[];arcs=[];numbers=[];bursts=[];daggers=[];bleeds=[];clock=0;executeStack=0;charge=0;chargeActive=false;extraDash=false;remoteInput={x:0,y:0,attack:false};net.remoteInput=remoteInput;$('overlay').style.display='none';updateHud();showRoundIntro();if(!host){phase='fight';$('roundIntro').style.display='none'}}
function remoteSkill(){// Run original class skill with remote actor as temporary player; use same skill implementation.
const op=player,oe=enemy,or=roleId,og=gear,ov=evolution,oa={...aim},oldExtra=extraDash,oldExecute=executeStack;
player=oe;enemy=op;roleId=oe.roleId;gear=oe.loadout;evolution=oe.evo||0;aim.x=remoteInput.aim?.x||-1;aim.y=remoteInput.aim?.y||0;
try{skill()}finally{player=op;enemy=oe;roleId=or;gear=og;evolution=ov;aim.x=oa.x;aim.y=oa.y;extraDash=oldExtra;executeStack=oldExecute}}
function finishNetRound(){if(stage!=='fight'||!host)return;stage='result';phase='pick';const winner=enemy.hp<=0?'host':'guest';if(winner==='host')localWins++;else otherWins++;netRound++;send({t:'result',winner,round:netRound,hostWins:localWins,guestWins:otherWins});showResult(winner)}
function showResult(winner){stage='result';phase='pick';$('overlay').style.display='none';panel.style.display='flex';content.innerHTML=`<h2>${(winner==='host')===host?'本回合获胜！':'本回合失利'}</h2><p>你 ${localWins} : ${otherWins} 对方</p><p>${localWins>=7||otherWins>=7?'七胜试炼结束！':'等待装备选择……'}</p>`;if(localWins>=7||otherWins>=7){stage='finished';content.innerHTML+=`<h2>${localWins>=7?'你赢得七胜！':'对方获得七胜'}</h2><p>返回菜单可重新开房。</p>`;return}if(host){setTimeout(()=>offerChoices(),650)}}
function offerChoices(){if(stage!=='result'||!host)return;stage='pick';localPick=remotePick=null;const advanced=netRound===6;const hostOptions=advanced?advancedOptions(localGear):gearOptions(localGear,chosen,0);const guestOptions=advanced?advancedOptions(otherGear):gearOptions(otherGear,otherRole,0);options=hostOptions.map(x=>({id:x.id,name:x.name,desc:x.desc}));remoteOptions=guestOptions.map(x=>({id:x.id,name:x.name,desc:x.desc}));send({t:'choices',items:remoteOptions,kind:advanced?'advanced':'normal'});showChoices(advanced?'advanced':'normal')}
function showChoices(kind){stage='pick';panel.style.display='flex';const advanced=kind==='advanced';content.innerHTML=`<h2>${advanced?'✦ 第五回合高级装备':'第 '+(netRound-1)+' 回合装备奖励'}</h2><p>从三件装备中选择一件，双方选完继续。</p><div class="line">${options.map((it,i)=>`<button class="choice" data-i="${i}" style="display:block;width:95%;margin:7px auto"><b>${it.name}</b><small>${it.desc}</small></button>`).join('')}</div>`;content.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const it=options[+b.dataset.i];localPick=it.id;content.innerHTML='<h3>已选择 '+it.name+'</h3><p>等待对方选择……</p>';if(host)checkPicks();else send({t:'pick',id:it.id})})}
function checkPicks(){if(!host||stage!=='pick'||!localPick||!remotePick)return;if(!options.some(x=>x.id===localPick)||!remoteOptions.some(x=>x.id===remotePick))return;localGear.push(localPick);otherGear.push(remotePick);send({t:'next',hostGear:localGear,guestGear:otherGear,round:netRound});beginFight()}
const fields=['x','y','hp','max','shield','face','cd','dashCd','dashTime','inv','slow','burn','slashTime','slashAngle','slashRange','slashSide','skillCd','boost','spin','spinAngle','spinElapsed','spinHits','stun','markTime','awakenSpeed','dx','dy','hit','empowered','slashDuration','spinHitMask','spinRefreshUsed','spinStage','spinThird','spinCastId','shieldDecay','bleedTime','bleedDps','berserkFatal','chargeValue','advancedCds','rewind','furnace','royalStack','mark','burnPower','burnTimer','furnaceBoost','furnaceBonus','laststandVamp'];
function snapActor(a){if(!a)return null;const o={};for(const k of fields)o[k]=a[k];o.roleId=a.roleId;o.loadout=a.loadout;o.r=a.r;return o}
function snapshot(){return {round:netRound,hostWins:localWins,guestWins:otherWins,phase,clock,player:snapActor(player),enemy:snapActor(enemy),walls,particles:particles.slice(-90),arcs:arcs.slice(-30),bursts:bursts.slice(-30),numbers:numbers.slice(-20),daggers:daggers.slice(-20),fissures:fissures.map(f=>({x:f.x,y:f.y,angle:f.angle,life:f.life,power:f.power})),dragonLanes:dragonLanes.map(f=>({x:f.x,y:f.y,angle:f.angle,life:f.life})),royalFields:royalFields.map(f=>({x:f.x,y:f.y,life:f.life})),delayedStrikes:delayedStrikes.map(f=>({x:f.x,y:f.y,angle:f.angle,range:f.range,time:f.time}))}}
function applySnapshot(s){if(!s||!s.player||!s.enemy)return;const guest=s.enemy,hostActor=s.player;if(!player||!enemy)return;Object.assign(player,guest);Object.assign(enemy,hostActor);player.roleId=chosen;player.loadout=localGear;enemy.roleId=otherRole;enemy.loadout=otherGear;clock=s.clock;phase=s.phase==='intro'?'fight':s.phase;round=s.round;wins=s.guestWins;losses=s.hostWins;particles=s.particles||[];arcs=s.arcs||[];bursts=s.bursts||[];numbers=s.numbers||[];daggers=s.daggers||[];fissures=s.fissures||[];dragonLanes=s.dragonLanes||[];royalFields=s.royalFields||[];delayedStrikes=s.delayedStrikes||[];updateHud()}
function sendInput(dt){lastSend+=dt;if(lastSend<.045)return;lastSend=0;const x=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),y=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);send({t:'input',v:{x,y,attack:held||!!keys.j,dash:dashRequest,skill:skillRequest||!!keys.k,aim:{x:aim.x,y:aim.y},relic:pendingRelic}});dashRequest=false;skillRequest=false;pendingRelic=null}
const net={active:false,host:false,remoteInput,queueRelic:id=>{pendingRelic=id},startRound:startNetRound,remoteSkill,roundEnded:finishNetRound,frame(dt){if(!net.active)return;if(host){if(stage==='fight'){update(dt);lastSnap+=dt;if(lastSnap>.05){lastSnap=0;send({t:'snapshot',v:snapshot()})}}}else if(stage==='fight'){sendInput(dt)}}};window.netDuel=net;
window.duelNetworkOpen=()=>{panel.style.display='flex';mainMenu();if(room())connect(false,room())};$('netBack').onclick=()=>{cleanup();panel.style.display='none';location.hash='';menu()};if(room())setTimeout(()=>window.duelNetworkOpen(),500);
})();</script></body></html>
